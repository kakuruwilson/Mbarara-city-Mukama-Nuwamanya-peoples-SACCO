<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — MBARARA CITY MUKAMA NUWAMANYA PEOPLE'S SACCO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="waves-container">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">M</div>
    <h1>Reset your password</h1>
    <p class="auth-sub">
      Enter your registered phone number or member number. A SACCO staff member will verify your identity and issue a temporary password.
    </p>

    <div id="server-message" style="display:none;" class="field-error show"></div>

    <form id="reset-form" action="php/forgot-password.php" method="POST" novalidate>
      <label for="identifier">Member number or phone</label>
      <input type="text" id="identifier" name="identifier" placeholder="e.g. MCMNP-0001 or 0772 123 456" required>
      <div class="field-error" id="identifier-error"></div>
      <button type="submit" class="btn btn-primary btn-block">
        <span class="btn-text">Request reset</span>
        <span class="spinner" style="display:none;"></span>
      </button>
    </form>

    <div class="offline-note">
      <i class="fa-solid fa-circle-info"></i>
      When internet is available, this can send an SMS/email code automatically. Contact admin for immediate reset.
    </div>

    <div class="auth-links">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>
</div>

<script src="js/validation.js"></script>
<script>
  document.getElementById('reset-form').addEventListener('submit', function() {
    const btn = this.querySelector('button[type="submit"]');
    btn.classList.add('btn-loading');
    btn.disabled = true;
  });

  const params = new URLSearchParams(window.location.search);
  const msgBox = document.getElementById('server-message');
  if (params.get('sent')) {
    msgBox.textContent = 'Reset request sent. A staff member will contact you shortly.'; 
    msgBox.style.color = 'var(--success)'; msgBox.style.display = 'block';
  } else if (params.get('error') === 'not_found') {
    msgBox.textContent = 'No member found with that information.'; msgBox.style.display = 'block';
  }
</script>
</body>
</html>
